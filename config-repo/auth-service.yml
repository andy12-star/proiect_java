server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/authdb
    username: root
    password: yourpass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    config:
      uri: http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: your_jwt_secret_key
  expiration-time: 3600
