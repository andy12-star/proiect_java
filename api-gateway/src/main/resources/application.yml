server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/courses/**
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/students/**
        - id: grade-service
          uri: lb://grade-service
          predicates:
            - Path=/api/grades/**
        - id: enrollment-service
          uri: lb://enrollment-grade
          predicates:
            - Path=/api/enrollments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
